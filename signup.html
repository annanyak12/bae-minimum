<title>Create a Demo Account | BAE MINIMUM Website</title><meta name="description" content="Create a BAE MINIMUM demo account to explore the website features. Account details are handled as described on this project website.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://bae-minimum.netlify.app/signup.html">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body><a class="skip" href="#main">Skip to content</a><div id="site-header"></div>
<main id="main"><div class="page-head"><div class="wrap"><span class="eyebrow">Join us</span><h1>Create Account</h1></div></div><section class="section"><div class="wrap">
<form class="form" id="signup-form" aria-label="Create account"><div class="notice"><strong>Demo only.</strong> Your details are stored in this browser only and are not secure. Use a made-up email and a throwaway password.</div><div id="form-msg" role="status"></div>
<div class="field"><label for="fullname">Full name</label><input id="fullname" name="fullname" required autocomplete="name"><p class="err" id="fullname-err"></p></div>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" data-v="email" required autocomplete="email"><p class="err" id="email-err"></p></div>
<div class="field"><label for="password">Password</label><div class="pw"><input id="password" name="password" type="password" data-v="newpw" required autocomplete="off"><button type="button" data-toggle-pw="password" aria-pressed="false">Show</button></div><p class="size">At least 8 characters, with a letter and a number.</p><p class="err" id="password-err"></p></div>
<div class="field"><label for="confirm">Confirm password</label><div class="pw"><input id="confirm" name="confirm" type="password" data-v="confirm" data-match="password" required autocomplete="off"><button type="button" data-toggle-pw="confirm" aria-pressed="false">Show</button></div><p class="err" id="confirm-err"></p></div>
<button class="btn" type="submit" style="width:100%">Create Account</button><p class="center">Already have an account? <a href="login.html">Login</a></p></form></div></section></main>
<div id="site-footer"></div><script src="script.js"></script></body></html>
